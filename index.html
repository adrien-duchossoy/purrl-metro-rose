<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Métro rose</title>
  <style>
    :root {
      --ink: oklch(0.97 0.01 350);
      --ink-dim: oklch(0.85 0.03 350);
      --veil: oklch(0.2 0.03 350 / 0.62);
      --accent: oklch(0.72 0.14 352);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: oklch(0.16 0.02 350); overflow: hidden; }
    body { font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    /* La scène 3D attend, invisible, au-dessus de la parallaxe */
    #gl2 { opacity: 0; transition: opacity 1s ease; pointer-events: none; }
    #gl2.visible { opacity: 1; }

    #metro {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 2;
      transform: translateX(-50%);
      font: inherit; font-size: 15px; letter-spacing: 0.02em; color: var(--ink);
      background: var(--veil); border: 1px solid oklch(1 0 0 / 0.25);
      padding: 14px 22px; border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.4s ease;
    }
    #metro:disabled { opacity: 0.5; }
    #toggle.hidden { opacity: 0; pointer-events: none; }
    #metro.hidden { opacity: 0; pointer-events: none; }

    #start {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 3;
      background: oklch(0.16 0.02 350 / 0.35);
      transition: opacity 0.6s ease;
    }
    #start.hidden { opacity: 0; pointer-events: none; }
    #start button {
      font: inherit; font-size: 15px; letter-spacing: 0.02em; color: var(--ink);
      background: var(--veil); border: 1px solid oklch(1 0 0 / 0.25);
      padding: 14px 22px; border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }

    #panel {
      position: fixed; right: 12px; top: 12px; z-index: 2; width: min(280px, calc(100vw - 24px));
      background: var(--veil); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid oklch(1 0 0 / 0.14); border-radius: 14px; padding: 12px 14px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #panel.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
    #panel h1 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
    label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; }
    label span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-dim); }
    input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
    select {
      grid-column: 1 / -1; width: 100%; font: inherit; color: var(--ink);
      background: oklch(1 0 0 / 0.08); border: 1px solid oklch(1 0 0 / 0.18); border-radius: 8px; padding: 6px 8px;
    }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .row button {
      font: inherit; color: var(--ink); background: oklch(1 0 0 / 0.08); border: 1px solid oklch(1 0 0 / 0.18);
      border-radius: 8px; padding: 6px 10px;
    }
    #status { margin-top: 8px; color: var(--ink-dim); font-size: 12px; }
    #toggle {
      position: fixed; right: 12px; bottom: 12px; z-index: 2; font: inherit; color: var(--ink);
      background: var(--veil); border: 1px solid oklch(1 0 0 / 0.18); border-radius: 999px; padding: 8px 12px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <canvas id="gl1"></canvas>
  <canvas id="gl2"></canvas>

  <div id="start"><button id="startBtn">Entrer sur le quai</button></div>

  <div id="panel" class="hidden">
    <h1>Réglages profondeur</h1>
    <label><span>Depth map</span><span></span>
      <select id="depthSel">
        <option value="calques" selected>Calques séparés (fond + lampes)</option>
        <option value="brut">Une image : depth brute</option>
        <option value="doux">Une image : contours doux</option>
        <option value="moyen">Une image : contours moyens</option>
        <option value="fort">Une image : contours forts</option>
      </select>
    </label>
    <label><span>Intensité</span><span id="vStrength"></span><input id="strength" type="range" min="0" max="0.08" step="0.001" value="0.055"></label>
    <label><span>Point de pivot</span><span id="vFocus"></span><input id="focus" type="range" min="0" max="1" step="0.01" value="0.12"></label>
    <label><span>Douceur</span><span id="vSmooth"></span><input id="smooth" type="range" min="0.01" max="0.3" step="0.01" value="0.19"></label>
    <label><span>Sensibilité gyro</span><span id="vGyro"></span><input id="gyro" type="range" min="5" max="45" step="1" value="26"></label>
    <label><span>Cadrage horizontal</span><span id="vFocusX"></span><input id="focusX" type="range" min="0" max="1" step="0.01" value="0.16"></label>
    <label><span>Brume</span><span id="vFog"></span><input id="fog" type="range" min="0" max="1.5" step="0.05" value="0.7"></label>
    <div class="row">
      <button id="showDepth">Voir la depth</button>
      <button id="recenter">Recentrer</button>
      <button id="idle">Balancement : off</button>
    </div>
    <div id="status"></div>
  </div>
  <button id="toggle">Réglages</button>
  <button id="metro" class="hidden" disabled>Chargement de la station…</button>

  <script type="module" src="/main.js"></script>
</body>
</html>
